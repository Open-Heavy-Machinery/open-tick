name: ci

# Pull requests run on pull_request; main runs on push. Pushing a branch
# that has a pull request no longer runs everything twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: host (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DOTK_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  core-only:
    name: core on a non-Linux host (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test core; the host zone is Linux-only and is left out
        run: |
          cmake -S . -B build -DOTK_WERROR=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  readme:
    name: README instructions, verbatim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test as the README says
        run: |
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Run the example as the README says
        run: |
          ./build/otk-flywheel examples/flywheel/step.csv
          ./build/otk-flywheel examples/flywheel/step.csv --trace flywheel.csv
          ./build/otk-flywheel examples/flywheel/step.csv --criteria examples/flywheel/step.accept.csv
          ./build/otk-flywheel examples/flywheel/step.csv --criteria examples/flywheel/step.accept.csv --verdicts step.verdicts.csv
          cmp step.verdicts.csv examples/flywheel/step.verdicts.csv
          ./build/otk-flywheel examples/flywheel/delay.csv --frames delay.frames.csv
          cmp delay.frames.csv examples/flywheel/delay.frames.csv
          ./build/otk-flywheel examples/flywheel/jitter.csv --seed 2 --frames jitter.frames.csv

  sanitizers:
    name: sanitizers (ASan, UBSan, float-cast-overflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep ASan working on kernels with high ASLR entropy
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=Debug
          -DOTK_WERROR=ON
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  socketcan:
    name: SocketCAN bridge on vcan (classic and CAN FD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up vcan0 with a CAN FD MTU
        id: vcan
        run: |
          if ! sudo modprobe vcan 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
            sudo modprobe vcan || true
          fi
          if sudo ip link add dev vcan0 type vcan && sudo ip link set vcan0 mtu 72 && sudo ip link set up vcan0; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          else
            echo "available=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: |
          cmake -S . -B build -DOTK_WERROR=ON
          cmake --build build -j --target test_socketcan test_hard_can otk-flywheel otk-fake-bridge
      - name: Round trip classic and CAN FD frames
        if: steps.vcan.outputs.available == 'yes'
        run: ./build/tests/test_socketcan
      - name: CAN on the bridge's clock (a synthetic mapping, then the hard loop against the fake bridge)
        if: steps.vcan.outputs.available == 'yes'
        run: ./build/tests/test_hard_can
      - name: otk-flywheel --driver hard, its SPEED frames on vcan0 and its frame log on the bridge's clock
        if: steps.vcan.outputs.available == 'yes'
        run: tests/hard_flywheel.sh build tests/data/hard_short.csv build/hard_flywheel
      - name: Report that the bridge was not tested
        if: steps.vcan.outputs.available != 'yes'
        run: echo "::warning::vcan is not available on this runner; the SocketCAN bridge and CAN on the bridge's clock were NOT tested"

  dependencies:
    name: dependency rule (core is ISO C; no application headers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/check_deps.sh

  mutation:
    name: mutation sanity (tests can fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up vcan0 with a CAN FD MTU, for the SocketCAN mutations
        run: |
          if ! sudo modprobe vcan 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          fi
          sudo ip link add dev vcan0 type vcan && sudo ip link set vcan0 mtu 72 && sudo ip link set up vcan0
      - name: Break each behaviour applications rely on; the tests must catch it
        env:
          OTK_MUTATION_NEED_CAN: "1"
        run: tools/mutation_check.sh

  gateware:
    name: Tang Nano 20K gateware (simulation against the codec, mutations, reproducible synthesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog
          iverilog -V 2>&1 | head -1
      - name: Build the codec's script generator and judge
        run: |
          cmake -S . -B build -DOTK_WERROR=ON
          cmake --build build -j --target otk-bridge-vectors
      - name: Simulate the blocks, and the whole bridge judged by the codec
        run: gateware/tang_nano_20k/sim/run.sh build
      - name: Break each gateware behaviour; the simulation must catch it
        run: gateware/tang_nano_20k/sim/mutations.sh build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # the lock has wheels for CPython 3.10 to 3.13
      - name: The pinned toolchain (every file by SHA-256)
        run: tools/fpga_toolchain.sh --synthesis-only
      - name: Build the bitstream twice; it must be the same
        run: |
          gateware/tang_nano_20k/build.sh "$PWD/build-gateware-1"
          gateware/tang_nano_20k/build.sh "$PWD/build-gateware-2"
          cmp build-gateware-1/bridge.fs build-gateware-2/bridge.fs
          md5sum build-gateware-1/bridge.fs
      - name: Upload the bitstream and the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tang-nano-20k-bridge
          path: |
            build-gateware-1/bridge.fs
            build-gateware-1/yosys.log
            build-gateware-1/nextpnr.log
            build/gateware-sim/tb_bridge.log
